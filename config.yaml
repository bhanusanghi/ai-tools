# Stock Divergence Scanner Configuration

# Indices to scan (stocks will be fetched from these)
indices:
  - "^GSPC"    # S&P 500
  - "^NDX"     # NASDAQ 100
  # - "^DJI"   # Dow Jones (optional)
  # - "^RUT"   # Russell 2000 (optional)

# Timeframes to analyze
timeframes:
  - "4h"       # 4-hour (requires intraday data)
  - "1d"       # Daily
  - "3d"       # 3-day (will be resampled)
  - "1wk"      # Weekly

# Indicator settings
indicators:
  rsi:
    enabled: true
    period: 14
    overbought: 70
    oversold: 30

  ao:  # Awesome Oscillator
    enabled: true
    fast_period: 5
    slow_period: 34

# Divergence detection settings
divergence:
  lookback_periods: 50  # How many periods to look back for divergence
  min_bars_between_pivots: 5  # Minimum bars between pivot points

  # Types of divergences to detect
  detect_bullish: true
  detect_bearish: true
  detect_hidden: false  # Set to true to also detect hidden divergences

# Data fetching
data:
  days_of_history: 180  # Days of historical data to fetch
  use_alpha_vantage: false  # Set to true if you have Alpha Vantage API key
  alpha_vantage_key: "YOUR_API_KEY_HERE"

# Output settings
output:
  directory: "outputs"
  filename_prefix: "divergence_scan"
  include_timestamp: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  directory: "logs"

# Scheduler settings
scheduler:
  enabled: false
  run_time: "09:00"  # Time to run daily (24-hour format)
  timezone: "America/New_York"  # Your timezone

# Telegram Notifications
notifications:
  telegram:
    enabled: false  # Set to true to enable Telegram notifications
    bot_token: "YOUR_BOT_TOKEN_HERE"  # Get from @BotFather on Telegram
    chat_id: "YOUR_CHAT_ID_HERE"  # Your Telegram chat ID

    # Notification preferences
    notify_on_scan_complete: true  # Send summary when scan completes
    notify_on_divergences: true    # Send alert when divergences found
    notify_on_errors: true         # Send alert on errors
    min_divergences_to_notify: 1   # Minimum divergences to trigger notification
